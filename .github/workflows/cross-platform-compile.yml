# Cross-platform COMPILE-ONLY check for the RISE library on Windows (MSVC) and
# Android (NDK, arm64-v8a).  Manual trigger only; no tests are run and no GUI is
# built.  See docs/CROSS_PLATFORM_CI.md for how to trigger and read it.
#
#   gh workflow run cross-platform-compile.yml --ref <branch> -f target=both
#
# Both jobs keep compiling past the first error, upload the full logs (and only
# the logs) as workflow artifacts, and write a de-duplicated error summary to the
# job summary and to the job log.

name: cross-platform-compile

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which platform to compile"
        type: choice
        options:
          - both
          - windows
          - android
        default: both

permissions:
  contents: read

concurrency:
  group: cross-platform-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ inputs.target == 'windows' || inputs.target == 'both' }}
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Developer environment (MSVC x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Pick platform toolset from the installed Visual Studio
        run: |
          # The checked-in projects say v145 (Visual Studio 2026).  windows-latest
          # may ship Visual Studio 2022 (v143), so choose from what is installed
          # and pass it on the msbuild command line (overrides the project).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $ver = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          Write-Host "Visual Studio installationVersion: $ver"
          $major = [int]($ver.Split('.')[0])
          $toolset = if ($major -ge 18) { 'v145' } else { 'v143' }
          Write-Host "Using PlatformToolset $toolset"
          "TOOLSET=$toolset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem "$env:VCINSTALLDIR\Tools\MSVC" | ForEach-Object { Write-Host "MSVC tools: $($_.Name)" }
          & cl 2>&1 | Select-Object -First 1 | Write-Host
          & msbuild -version | Select-Object -Last 1 | Write-Host

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-win-${{ hashFiles('build/VS2022/vcpkg.json') }}-v1

      - name: Install dependencies with vcpkg (zlib, libpng, openexr)
        run: |
          New-Item -ItemType Directory -Force -Path logs, $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          # The library and the console program need only zlib, libpng and OpenEXR.
          # The full manifest also lists Qt and FFmpeg for the GUI, which this
          # compile-only job does not build, so install a trimmed copy of it (same
          # baseline).
          $ci = Join-Path $env:RUNNER_TEMP 'vcpkg-manifest'
          New-Item -ItemType Directory -Force -Path $ci | Out-Null
          $m = Get-Content build\VS2022\vcpkg.json -Raw | ConvertFrom-Json
          $m.dependencies = @('zlib', 'libpng', 'openexr')
          $m | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $ci 'vcpkg.json') -Encoding utf8
          Get-Content (Join-Path $ci 'vcpkg.json') | Write-Host
          # The projects look in vcpkg_installed\x64-windows\x64-windows\{include,lib}.
          $root = Join-Path $PWD 'build\VS2022\vcpkg_installed\x64-windows'
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install --triplet x64-windows "--x-manifest-root=$ci" "--x-install-root=$root" 2>&1 | Tee-Object -FilePath logs\vcpkg-install.log
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::vcpkg install failed"; exit 1 }
          Get-ChildItem "$root\x64-windows\lib" -Filter *.lib | ForEach-Object { Write-Host "lib: $($_.Name)" }

      - name: Adjust the checked-out projects for a dependency-light build
        run: |
          # OIDN and OpenPGL are not vendored (OIDN is built into extlib\oidn\install,
          # OpenPGL is expected at C:\Dev\openpgl-install) and the Android build
          # compiles without both, so build the library without them: drop the two
          # ABI defines, the three import libraries and the VerifyOidnInstall guard target.  The CLI also needs zlib and
          # libpng on the link line (the vcpkg MSBuild integration adds these
          # automatically, but it is switched off here).  This edits only the CI
          # workspace.
          foreach ($f in 'build\VS2022\Library\Library.vcxproj', 'build\VS2022\RISE-CLI\RISE-CLI.vcxproj') {
            $t = Get-Content $f -Raw
            $t = $t -replace 'RISE_ENABLE_OIDN;', '' -replace 'RISE_ENABLE_OPENPGL;', ''
            $t = $t -replace 'OpenImageDenoise\.lib;OpenImageDenoise_core\.lib;openpgl\.lib;', ''
            if ($f -like '*Library.vcxproj') {
              # Guard target that fails the build when extlib\oidn\install is missing.
              $t = [regex]::Replace($t, '(?s)<Target Name="VerifyOidnInstall".*?</Target>', '')
            }
            if ($f -like '*RISE-CLI*') { $t = $t -replace 'RISE\.lib;', 'RISE.lib;libpng16.lib;zlib.lib;' }
            Set-Content -Path $f -Value $t -NoNewline -Encoding utf8
          }
          git diff --stat

      - name: Compile (Library, RISE-CLI, tools)
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $sd = "$PWD\build\VS2022\"
          $props = @(
            '/p:Configuration=Release', '/p:Platform=x64', "/p:SolutionDir=$sd",
            "/p:PlatformToolset=$env:TOOLSET",
            '/p:VcpkgEnabled=false',                # dependencies were installed above
            '/p:PostBuildEventUseInBuild=false',    # skip the license-staging script
            '/p:MultiProcessorCompile=true',        # cl /MP
            '/p:StopOnFirstFailure=false',
            '/m', '/nologo', '/nr:false', '/v:minimal'
          )
          $failed = @()

          foreach ($p in @(@('Library', 'build\VS2022\Library\Library.vcxproj'),
                           @('RISE-CLI', 'build\VS2022\RISE-CLI\RISE-CLI.vcxproj'))) {
            $name = $p[0]
            Write-Host "::group::msbuild $name"
            & msbuild $p[1] @props "/flp1:logfile=logs\msbuild-$name.log;verbosity=normal;encoding=UTF-8" "/flp2:logfile=logs\msbuild-$name.errors.log;errorsonly;encoding=UTF-8"
            $rc = $LASTEXITCODE
            Write-Host "::endgroup::"
            Write-Host "msbuild $name exit code: $rc"
            if ($rc -ne 0) { $failed += $name }
          }

          # rise_sim and simulation_cache_import have no VS2022 project (the Windows
          # build has no rise-sim target); syntax-and-semantics check them with cl.
          Write-Host "::group::cl tools/rise_sim.cpp tools/simulation_cache_import.cpp"
          $inc = "$sd" + "vcpkg_installed\x64-windows\x64-windows\include"
          $obj = Join-Path $PWD 'logs\tool-objs'
          New-Item -ItemType Directory -Force -Path $obj | Out-Null
          & cl /nologo /c /std:c++17 /EHsc /MD /O1 /Zc:__cplusplus /permissive- /utf-8 /W3 `
            /DCOLORS_RGB /DMERSENNE53 /DNO_TIFF_SUPPORT /DWIN32 /D_WINDOWS /D_CRT_SECURE_NO_WARNINGS `
            /DNOMINMAX /DIMATH_HALF_NO_LOOKUP_TABLE /DRISE_ENABLE_PROFILING /DNDEBUG `
            "/I$inc" "/I$inc\OpenEXR" "/I$inc\Imath" "/Isrc\Library" "/Fo$obj\" `
            tools\rise_sim.cpp tools\simulation_cache_import.cpp 2>&1 | Tee-Object -FilePath logs\cl-tools.log
          $rc = $LASTEXITCODE
          Write-Host "::endgroup::"
          Write-Host "cl tools exit code: $rc"
          if ($rc -ne 0) { $failed += 'tools' }

          if ($failed.Count -gt 0) {
            Write-Host "::error::compile failures in: $($failed -join ', ')"
            exit 1
          }

      - name: Error summary
        if: ${{ always() }}
        run: |
          $ws = $env:GITHUB_WORKSPACE + '\'
          $lines = @()
          foreach ($f in Get-ChildItem logs -Include *.errors.log, cl-tools.log, vcpkg-install.log -Recurse -ErrorAction SilentlyContinue) {
            $lines += Get-Content $f.FullName -Encoding UTF8 | Where-Object { $_ -match '\b(fatal )?error\s+[A-Z]+\d+' -or $_ -match ':\s*error\s*:' -or $_ -match 'CMake Error|error:' }
          }
          $norm = $lines | ForEach-Object {
            ($_ -replace '\s*\[[^\]]*\]\s*$', '').Replace($ws, '').Trim()
          } | Select-Object -Unique
          $total = @($norm).Count
          $out = New-Object System.Collections.Generic.List[string]
          $out.Add("## Windows compile: $total distinct error lines")
          $out.Add('')
          $codes = $norm | ForEach-Object { if ($_ -match '\b(?:fatal )?error\s+([A-Z]+\d+)') { $Matches[1] } } | Group-Object | Sort-Object Count -Descending | Select-Object -First 15
          if ($codes) {
            $out.Add('Top error codes: ' + (($codes | ForEach-Object { "$($_.Name) x$($_.Count)" }) -join ', '))
            $out.Add('')
          }
          $out.Add('```')
          $norm | Select-Object -First 200 | ForEach-Object { $out.Add($_) }
          $out.Add('```')
          if ($total -gt 200) { $out.Add("... $($total - 200) more in the logs artifact") }
          $out | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Host "::group::Windows error summary ($total distinct lines)"
          $out | ForEach-Object { Write-Host $_ }
          Write-Host "::endgroup::"

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-compile-logs
          path: |
            logs/*.log
          retention-days: 14
          if-no-files-found: warn

  android:
    if: ${{ inputs.target == 'android' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Select the NDK
        run: |
          # The Android project pins NDK 27.0.12077973.  Use an NDK 27 from the
          # runner image if there is one, else the image's latest NDK.
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          pinned="$(ls -d "$sdk"/ndk/27.* 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$pinned" ]; then ndk="$pinned"; fi
          echo "NDK: $ndk"
          ls "$sdk/ndk" || true
          cat "$ndk/source.properties"
          echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"
          cmake --version | head -n 1
          (ninja --version || sudo apt-get install -y ninja-build) 2>&1 | tail -n 1

      - name: Configure (arm64-v8a)
        run: |
          mkdir -p logs
          set -o pipefail
          cmake -S build/cmake/rise-android -B _out -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DRISE_JNI_SOURCES_DIR="$PWD/android/app/src/main/cpp" 2>&1 | tee logs/android-configure.log

      - name: Compile (librise.a, then the JNI library), keep going past errors
        run: |
          mkdir -p logs
          set +e   # the default bash options are -e -o pipefail; both builds must run
          failed=0
          # -k 0: ninja keeps going however many jobs fail.
          cmake --build _out --target rise -- -k 0 2>&1 | tee logs/android-rise.log
          [ "${PIPESTATUS[0]}" -eq 0 ] || failed=1
          cmake --build _out --target rise_jni -- -k 0 2>&1 | tee logs/android-rise-jni.log
          [ "${PIPESTATUS[0]}" -eq 0 ] || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "::error::Android compile failed"
            exit 1
          fi

      - name: Error summary
        if: ${{ always() }}
        run: |
          shopt -s nullglob
          files=(logs/android-*.log)
          ws="$GITHUB_WORKSPACE/"
          {
            if [ ${#files[@]} -gt 0 ]; then
              grep -hE ': (fatal )?error[: ]|undefined (reference|symbol)|CMake Error|ld(\.lld)?: error' "${files[@]}" \
                | sed -e "s#${ws}##g" -e 's#^\(\.\./\)*##' | awk '!seen[$0]++' > logs/android-errors.txt || true
            else
              : > logs/android-errors.txt
            fi
            total=$(wc -l < logs/android-errors.txt | tr -d ' ')
            echo "## Android (arm64-v8a) compile: $total distinct error lines"
            echo
            if [ "$total" -gt 0 ]; then
              echo "Errors per file (top 15):"
              echo '```'
              sed -nE 's#^([^:]+):[0-9]+:[0-9]+: .*#\1#p' logs/android-errors.txt | sort | uniq -c | sort -rn | head -n 15
              echo '```'
            fi
            echo '```'
            head -n 200 logs/android-errors.txt
            echo '```'
            if [ "$total" -gt 200 ]; then echo "... $((total - 200)) more in the logs artifact"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-compile-logs
          path: |
            logs/*.log
            logs/*.txt
          retention-days: 14
          if-no-files-found: warn
